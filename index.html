<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Intelligence</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f0;
            color: #1a1a1a;
            min-height: 100vh;
        }

        header {
            background: #1a1a2e;
            color: white;
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 { font-size: 18px; font-weight: 500; }
        header p { font-size: 13px; color: #9999bb; }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }

        .upload-card {
            background: white;
            border-radius: 12px;
            border: 1.5px dashed #d0d0c8;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 1.5rem;
        }

        .upload-card:hover { border-color: #5353cc; background: #f8f8ff; }
        .upload-card.dragging { border-color: #5353cc; background: #f0f0ff; }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 1rem;
        }

        .upload-card h2 { font-size: 16px; font-weight: 500; margin-bottom: 0.5rem; }
        .upload-card p { font-size: 13px; color: #777; }

        #fileInput { display: none; }

        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6rem 1.5rem;
            background: #5353cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #4040aa; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }

        .status {
            display: none;
            background: white;
            border-radius: 12px;
            border: 0.5px solid #e0e0d8;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-top-color: #5353cc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .results { display: none; }

        .section {
            background: white;
            border-radius: 12px;
            border: 0.5px solid #e0e0d8;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .section h3 {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat {
            background: #f5f5f0;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value { font-size: 24px; font-weight: 500; color: #1a1a2e; }
        .stat-label { font-size: 12px; color: #777; margin-top: 4px; }

        .entity-group { margin-bottom: 1rem; }
        .entity-label { font-size: 12px; font-weight: 500; color: #777; margin-bottom: 6px; }

        .tags { display: flex; flex-wrap: wrap; gap: 6px; }

        .tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag-org { background: #eeeeff; color: #3333aa; }
        .tag-date { background: #eef8ee; color: #227722; }
        .tag-money { background: #fff8ee; color: #aa5500; }
        .tag-loc { background: #ffeef8; color: #aa3377; }
        .tag-person { background: #eef5ff; color: #2255aa; }

        .clause-list { display: flex; flex-direction: column; gap: 8px; }

        .clause-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            background: #f5f5f0;
            border-radius: 8px;
        }

        .clause-name { font-size: 13px; font-weight: 500; }

        .clause-score {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-bar-bg {
            width: 80px;
            height: 6px;
            background: #e0e0d8;
            border-radius: 3px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            background: #5353cc;
            border-radius: 3px;
        }

        .score-num { font-size: 12px; color: #777; width: 36px; text-align: right; }

        .similar-item {
            padding: 0.75rem 0;
            border-bottom: 0.5px solid #e0e0d8;
        }

        .similar-item:last-child { border-bottom: none; }
        .similar-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
        .similar-text { font-size: 12px; color: #777; line-height: 1.5; }

        .similar-score {
            display: inline-block;
            font-size: 11px;
            background: #eeeeff;
            color: #3333aa;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 4px;
        }

        .error {
            background: #fff0f0;
            border: 0.5px solid #ffcccc;
            border-radius: 8px;
            padding: 1rem;
            color: #cc3333;
            font-size: 14px;
        }

        .filename {
            font-size: 13px;
            color: #5353cc;
            font-weight: 500;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Contract Intelligence</h1>
        <p>AI-powered legal contract analysis</p>
    </div>
</header>

<div class="container">

    <div class="upload-card" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📄</div>
        <h2>Upload a contract PDF</h2>
        <p>Drag and drop or click to browse</p>
        <input type="file" id="fileInput" accept=".pdf" onchange="handleFile(this.files[0])">
        <br>
        <button class="btn" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">
            Choose file
        </button>
    </div>

    <div class="status" id="status">
        <span class="spinner"></span>
        <span id="statusText">Analyzing contract...</span>
    </div>

    <div class="results" id="results"></div>

</div>

<script>
    const dropZone = document.getElementById('dropZone');

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragging');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));

    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragging');
        const file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.pdf')) handleFile(file);
    });

    async function handleFile(file) {
        if (!file) return;

        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const results = document.getElementById('results');

        status.style.display = 'block';
        results.style.display = 'none';
        results.innerHTML = '';
        statusText.textContent = `Analyzing ${file.name}...`;

        const formData = new FormData();
        formData.append('file', file);

        try {
            const res = await fetch('http://localhost:8000/analyze', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || 'Analysis failed');
            }

            const data = await res.json();
            status.style.display = 'none';
            results.style.display = 'block';
            renderResults(data, file.name);

        } catch (err) {
            status.style.display = 'none';
            results.style.display = 'block';
            results.innerHTML = `<div class="error">Error: ${err.message}</div>`;
        }
    }

    function renderResults(data, filename) {
        const results = document.getElementById('results');
        const ext = data.extraction || {};
        const entities = data.entities || {};
        const classification = data.classification || {};
        const similar = data.similar_contracts || [];
        const clauses = classification.detected_clauses || [];

        const entityHTML = buildEntities(entities);
        const clauseHTML = buildClauses(clauses);
        const similarHTML = buildSimilar(similar);

        results.innerHTML = `
            <div class="section">
                <h3>Document</h3>
                <div style="margin-bottom:1rem">
                    <span class="filename">📄 ${filename}</span>
                </div>
                <div class="stat-grid">
                    <div class="stat">
                        <div class="stat-value">${ext.num_pages || 0}</div>
                        <div class="stat-label">Pages</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${(ext.total_chars || 0).toLocaleString()}</div>
                        <div class="stat-label">Characters</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${clauses.length}</div>
                        <div class="stat-label">Clauses detected</div>
                    </div>
                </div>
            </div>

            ${entityHTML ? `
            <div class="section">
                <h3>Entities found</h3>
                ${entityHTML}
            </div>` : ''}

            ${clauseHTML ? `
            <div class="section">
                <h3>Detected clauses</h3>
                <div class="clause-list">${clauseHTML}</div>
            </div>` : ''}

            ${similarHTML ? `
            <div class="section">
                <h3>Similar contracts</h3>
                ${similarHTML}
            </div>` : ''}
        `;
    }

    function buildEntities(entities) {
        const map = {
            ORG:    { label: 'Organizations', cls: 'tag-org' },
            DATE:   { label: 'Dates',         cls: 'tag-date' },
            MONEY:  { label: 'Money',          cls: 'tag-money' },
            GPE:    { label: 'Locations',      cls: 'tag-loc' },
            PERSON: { label: 'People',         cls: 'tag-person' },
        };
        let html = '';
        for (const [key, meta] of Object.entries(map)) {
            const items = (entities[key] || []).slice(0, 8);
            if (!items.length) continue;
            html += `<div class="entity-group">
                <div class="entity-label">${meta.label}</div>
                <div class="tags">
                    ${items.map(e => `<span class="tag ${meta.cls}">${e.text}</span>`).join('')}
                </div>
            </div>`;
        }
        return html;
    }

    function buildClauses(clauses) {
        if (!clauses.length) return '<p style="color:#777;font-size:13px">No clauses detected in mock mode. Configure HF_TOKEN to enable real classification.</p>';
        return clauses.map(c => {
            const pct = Math.round(c.score * 100);
            return `<div class="clause-item">
                <span class="clause-name">${c.clause}</span>
                <div class="clause-score">
                    <div class="score-bar-bg">
                        <div class="score-bar-fill" style="width:${pct}%"></div>
                    </div>
                    <span class="score-num">${pct}%</span>
                </div>
            </div>`;
        }).join('');
    }

    function buildSimilar(similar) {
        if (!similar.length || similar[0].note) return '';
        return similar.map(s => `
            <div class="similar-item">
                <div><span class="similar-score">Score: ${(s.score * 100).toFixed(0)}%</span></div>
                <div class="similar-name">${s.contract_id.slice(0, 60)}${s.contract_id.length > 60 ? '...' : ''}</div>
                <div class="similar-text">${s.text.slice(0, 180)}...</div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
